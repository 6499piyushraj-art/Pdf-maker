name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

      - name: Build the Vercel/domain-root version
        run: npm run build
      - name: Verify Vercel production assets
        run: npm run test:dist

      - name: Build the GitHub Pages/project-subpath version
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify GitHub Pages production assets
        run: npm run test:dist
        env:
          GITHUB_PAGES: "true"
